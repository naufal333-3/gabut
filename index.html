<script>
function hitungBMI() {

    const umur = Number(document.getElementById("umur").value);
    const berat = Number(document.getElementById("berat").value);
    const tinggiCm = Number(document.getElementById("tinggi").value);

    if (umur <= 0 || berat <= 0 || tinggiCm <= 0) {
        alert("Masukkan umur, berat badan, dan tinggi badan dengan benar.");
        return;
    }

    const tinggi = tinggiCm / 100;
    const bmi = berat / (tinggi * tinggi);

    let kategori, warna;

    if (bmi < 18.5) {
        kategori = "Kurus";
        warna = "#3B82F6";
    } else if (bmi < 25) {
        kategori = "Normal";
        warna = "#22C55E";
    } else if (bmi < 30) {
        kategori = "Overweight";
        warna = "#FACC15";
    } else {
        kategori = "Obesitas";
        warna = "#EF4444";
    }

    const bbIdealMin = (18.5 * tinggi * tinggi).toFixed(1);
    const bbIdealMax = (24.9 * tinggi * tinggi).toFixed(1);
    const kalori = Math.round(berat * 30);

    let saran;

    if (umur < 18) {
        saran = "Perbanyak aktivitas fisik dan konsumsi makanan bergizi.";
    } else if (umur <= 40) {
        saran = "Pertahankan pola hidup sehat dan olahraga rutin.";
    } else if (umur <= 60) {
        saran = "Jaga berat badan ideal untuk mengurangi risiko penyakit kronis.";
    } else {
        saran = "Perhatikan massa otot, kesehatan tulang, dan nutrisi harian.";
    }

    document.getElementById("result").style.display = "block";

    document.getElementById("bmiText").innerHTML =
        `BMI Kamu: <b>${bmi.toFixed(1)}</b>`;

    document.getElementById("kategori").innerHTML =
        `Kategori: ${kategori}`;

    document.getElementById("kategori").style.backgroundColor = warna;
    document.getElementById("kategori").style.color = "#fff";

    document.getElementById("bar").style.width =
        Math.min((bmi / 40) * 100, 100) + "%";

    document.getElementById("bar").style.backgroundColor = warna;

    document.getElementById("ideal").innerHTML =
        `🎯 Berat Badan Ideal: ${bbIdealMin} - ${bbIdealMax} kg`;

    document.getElementById("kalori").innerHTML =
        `🔥 Estimasi Kalori Harian: ${kalori} kkal`;

    document.getElementById("saran").innerHTML =
        `💡 ${saran}`;

    document.querySelector(".container").style.border =
        `3px solid ${warna}`;
}
</script>
